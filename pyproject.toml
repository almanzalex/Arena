[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena"
dynamic = ["version"]
description = "Portable RL policy/evaluation interoperability across native and external runtimes"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Arena Contributors" }]
keywords = ["reinforcement-learning", "marl", "interoperability", "pettingzoo"]
dependencies = [
  "pyyaml>=6.0,<7",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
torch = ["torch>=2.2,<3"]
pettingzoo = ["pettingzoo>=1.24,<2", "gymnasium>=0.29,<2", "mpe2>=1.0,<2"]
wrappers = ["supersuit>=3.9,<4"]
openenv = ["openenv>=0.4.1,<0.5", "arena[pettingzoo]"]
openspiel = ["open_spiel>=2.0.1,<3", "gymnasium>=1.0"]
hf = ["huggingface_hub>=0.27,<2"]
wandb = ["wandb>=0.17,<1"]
mlflow = ["mlflow>=2.14,<4"]
signing = ["cryptography>=43"]
quickstart = ["arena[torch]"]
gimitest = ["pillow>=10,<13"]
# OCI uses the standard ORAS CLI so it shares the user's registry auth/config.
oci = []
# Gimitest 1.0 pins Gymnasium 0.29.1 while current PettingZoo requires >=1.0.
# It is deliberately not expressed as a co-installable extra; docs use a
# compatibility-checked `pip install --no-deps gimitest==1.0` provider install.
all = ["arena[torch,pettingzoo,wrappers,signing,gimitest]"]
integrations = ["arena[openenv,openspiel,hf,wandb,mlflow]"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "build>=1.2",
  "hatchling>=1.21",
  "arena[all,integrations]",
]

[project.scripts]
arena = "arena.cli.main:main"

[project.urls]
Homepage = "https://github.com/almanzalex/Arena"
Documentation = "https://github.com/almanzalex/Arena/tree/main/docs"
Repository = "https://github.com/almanzalex/Arena"
Issues = "https://github.com/almanzalex/Arena/issues"

[tool.hatch.version]
path = "arena/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the default selection fast: the slow wheel-build / hermetic-venv and
# Docker gates are opt-in. Run them with `pytest -m slow` / `pytest -m docker`.
addopts = "-m 'not slow and not docker'"
markers = [
  "acceptance: MVP acceptance gates P/M/D/U",
  "requires_torch: needs torch extra",
  "requires_pettingzoo: needs pettingzoo extra",
  "slow: slow gates (wheel build + hermetic venv install)",
  "docker: hermetic gate that requires a working Docker daemon",
  "requires_openenv: needs the OpenEnv extra",
  "requires_openspiel: needs the OpenSpiel extra",
  "requires_gimitest: needs a compatible Gimitest provider install",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

name: Release candidate evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.*"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  exact-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exact wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            bandit build cyclonedx-bom detect-secrets pip-audit
          python -m build
      - name: Install exact wheel and run offline demo
        run: |
          python -m venv /tmp/rlx-release-venv
          WHEEL="$(ls dist/*.whl)"
          /tmp/rlx-release-venv/bin/python -m pip install --upgrade pip
          /tmp/rlx-release-venv/bin/python -m pip install "${WHEEL}[quickstart,openenv]"
          cd /tmp
          /tmp/rlx-release-venv/bin/rlx --version
          /tmp/rlx-release-venv/bin/rlx doctor --capability core --json
          /tmp/rlx-release-venv/bin/rlx schema list --json
          env PIP_NO_INDEX=1 /tmp/rlx-release-venv/bin/rlx demo handoff --out /tmp/rlx-demo --json
          env PIP_NO_INDEX=1 /tmp/rlx-release-venv/bin/rlx inspect /tmp/rlx-demo/restored-policy.rlx --json
      - name: Prove resolver-isolated Gimitest boundary
        run: |
          python -m venv /tmp/rlx-gimitest-venv
          WHEEL="$(ls dist/*.whl)"
          /tmp/rlx-gimitest-venv/bin/python -m pip install --upgrade pip
          /tmp/rlx-gimitest-venv/bin/python -m pip install \
            "${WHEEL}[torch,pettingzoo]"
          /tmp/rlx-gimitest-venv/bin/python -m pip install \
            --no-deps gimitest==1.0
          export RLX_GIMITEST_PYTHON=/tmp/rlx-gimitest-venv/bin/python
          /tmp/rlx-release-venv/bin/rlx doctor --capability gimitest --json
          /tmp/rlx-release-venv/bin/python examples/1.0/run_local_boundaries.py \
            --out /tmp/rlx-boundary-proof
          cp /tmp/rlx-boundary-proof/result.json \
            dist/gimitest-boundary-proof.json
      - name: Generate SBOM and audit the exact quickstart environment
        run: |
          cyclonedx-py environment --output-reproducible --output-format JSON \
            --output-file dist/sbom.cdx.json /tmp/rlx-release-venv/bin/python
          pip-audit --progress-spinner off \
            --path /tmp/rlx-release-venv/lib/python3.12/site-packages \
            --format json --output dist/pip-audit.json
          python scripts/check_pip_audit.py dist/pip-audit.json --allow-unpublished rlx
          bandit -q -r rlx -ll -f json -o dist/bandit.json
          detect-secrets scan --all-files \
            --exclude-files '(^|/)(\.venv|dist|\.git|\.pytest_cache|\.ruff_cache|tests|docs|examples)/' \
            --exclude-files '\.(pt|whl|gz)$' > dist/secrets-scan.json
          python scripts/check_secret_scan.py dist/secrets-scan.json
          sha256sum dist/*.whl dist/*.tar.gz dist/sbom.cdx.json \
            dist/pip-audit.json dist/bandit.json dist/secrets-scan.json \
            dist/gimitest-boundary-proof.json \
            > dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: rlx-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error

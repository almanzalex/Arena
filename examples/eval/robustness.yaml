schema: arena.evaluation/v0alpha1
name: rps-gimitest-robustness
provider: gimitest
provider_config:
  suite: base-hooks
  test_class: arena.adapters.eval_gimitest.scenarios:RewardTransformScenario
  parameters:
    purpose: Arena non-no-op provider qualification
    reward_scale: -1.0
interaction: parallel
task:
  adapter: pettingzoo-parallel
  env: arena/competitive_rps_v0
  interaction: parallel
  config:
    max_cycles: 1
assignments:
  player_0: ./demo/rock.arena
  player_1: ./demo/paper.arena
seeds:
  start: 0
  count: 2
action_mode: deterministic
metrics:
  - mean_return
  - win_rate
